version: "3.8"

services:
  spacegrep-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spacegrep-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-8000}:8000"
    volumes:
      # Persistent host mount for SQLite database, images, and seed_photos drop folder
      - ./data:/app/data
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - WHITEBOX_LOGO_URL=${WHITEBOX_LOGO_URL:-}
      - WHITEBOX_LINK_URL=${WHITEBOX_LINK_URL:-}
      - DATA_DIR=/app/data
      - PORT=8000

  caddy:
    image: caddy:alpine
    container_name: spacegrep-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: caddy_config
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME:-example.com}
    depends_on:
      - spacegrep-app

configs:
  caddy_config:
    content: |
      ${DOMAIN_NAME:-example.com} {
          log {
              output stdout
              format json
          }
          reverse_proxy spacegrep-app:8000
      }

volumes:
  caddy_data:
  caddy_config:
